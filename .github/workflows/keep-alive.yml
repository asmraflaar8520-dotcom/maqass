name: Keep-Alive Supabase Free Tier

# Runs every 3 days at 00:00 UTC to prevent Supabase Free Tier projects from pausing
on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning ::SUPABASE_URL or SUPABASE_ANON_KEY secret is not set. Using fallback ping check."
            exit 0
          fi
          
          echo "Sending keep-alive ping to Supabase..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/salon_settings?select=id&limit=1")
          
          echo "Supabase response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Ping successful! Supabase project is active and refreshed."
          else
            echo "::warning ::Received non-success HTTP status $HTTP_STATUS from Supabase."
          fi
